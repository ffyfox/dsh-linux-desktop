# dsh-linux-integration 的 profile 补丁层。
#
# 本层只插入一行：Linux 桌面集成宿主插件。它在 dsh web 的 HTTP 服务绑定之后：
#   1. 把「端口 + 进程号 + 带 token 的地址」发布到运行时文件，供桌面启动器读取；
#   2. 幂等地安装/自愈 XDG 桌面入口、图标、KWin 窗口规则与启动脚本。
#
# 该行 inject 了 connection / webServer 两个宿主服务。在 tui、headless 等没有
# 这两个服务的 profile 里，这一行会停留在 PENDING 状态而不激活 —— 这正是我们
# 想要的：桌面集成只在 dsh web 里生效，不影响其它 profile。
- insert:
    - id: linux-desktop
      name: dsh-linux-integration
